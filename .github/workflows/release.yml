name: Release skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: $tag" >&2
            exit 1
          fi
          recorded_version="$(<VERSION)"
          if [[ "$recorded_version" != v* ]]; then
            recorded_version="v$recorded_version"
          fi
          if [[ "$tag" != "$recorded_version" ]]; then
            echo "Release tag $tag does not match VERSION $recorded_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate public source and release manifest
        shell: bash
        run: |
          set -euo pipefail

          test ! -e scripts
          test ! -e skills/develop
          test ! -e publish/skillhub
          test ! -e publish/wb-connector
          if find publish -mindepth 1 -maxdepth 1 ! -name releases -print -quit | grep -q .; then
            echo "publish/ may contain only releases/ in the public repository" >&2
            exit 1
          fi
          if find skills -type f -name skillhub.json -print -quit | grep -q .; then
            echo "Private SkillHub metadata must not be published" >&2
            exit 1
          fi

          mapfile -t skill_dirs < <(find skills -type f -name SKILL.md -printf '%h\n' | sort)
          ((${#skill_dirs[@]} > 0))
          skill_names=()
          declare -A seen_skills=()
          for skill_dir in "${skill_dirs[@]}"; do
            [[ "$skill_dir" =~ ^skills/[^/]+/[^/]+$ ]]
            skill="${skill_dir##*/}"
            [[ "$skill" =~ ^[a-z0-9-]+$ ]]
            [[ -z "${seen_skills[$skill]+present}" ]]
            seen_skills["$skill"]=true
            skill_names+=("$skill")
            grep -Eq "^name:[[:space:]]*['\"]?${skill}['\"]?[[:space:]]*$" "$skill_dir/SKILL.md"
          done

          manifest="publish/releases/${GITHUB_REF_NAME}.json"
          expected_version="${GITHUB_REF_NAME#v}"
          known_skills="$(printf '%s\n' "${skill_names[@]}" | jq -R . | jq -s .)"
          test -f "$manifest"
          jq -e \
            --arg version "$expected_version" \
            --argjson known "$known_skills" '
              type == "object"
              and (keys | sort) == ["skills", "version"]
              and (.version == $version)
              and (.skills | type == "array" and length > 0)
              and (([.skills[].name] | length) == ([.skills[].name] | unique | length))
              and all(.skills[];
                type == "object"
                and (keys | sort) == ["changelog", "name", "type"]
                and (.name | type == "string")
                and (.name as $name | ($known | index($name)) != null)
                and (.type == "patch" or .type == "minor" or .type == "major")
                and (.changelog | type == "string" and test("[^[:space:]]"))
              )
            ' "$manifest" > /dev/null

      - name: Match release manifest to skill changes
        shell: bash
        run: |
          set -euo pipefail
          manifest="publish/releases/${GITHUB_REF_NAME}.json"
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-version:refname \
              | grep -Fvx "$GITHUB_REF_NAME" \
              | head -n 1 \
              || true
          )"

          mapfile -t skill_dirs < <(find skills -type f -name SKILL.md -printf '%h\n' | sort)
          ((${#skill_dirs[@]} > 0))

          for skill_dir in "${skill_dirs[@]}"; do
            skill="${skill_dir##*/}"
            if jq -e --arg skill "$skill" 'any(.skills[]; .name == $skill)' "$manifest" > /dev/null; then
              listed="true"
            else
              listed="false"
            fi

            if [[ -z "$previous_tag" ]]; then
              changed="true"
            elif git diff --quiet "$previous_tag" "$GITHUB_SHA" -- "$skill_dir"; then
              changed="false"
            else
              changed="true"
            fi

            if [[ "$listed" != "$changed" ]]; then
              echo "Release manifest mismatch for $skill: listed=$listed changed=$changed" >&2
              exit 1
            fi
          done

          if [[ -z "$previous_tag" ]]; then
            echo "Validated first release manifest against all skills."
          else
            echo "Validated release manifest against changes since $previous_tag."
          fi

      - name: Verify discovery and individual installation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes skills@1.5.9 add . --list

          manifest="publish/releases/${GITHUB_REF_NAME}.json"
          while IFS= read -r skill; do
            skill_dir="$(find skills -mindepth 2 -maxdepth 2 -type d -name "$skill" -print)"
            [[ -n "$skill_dir" && "$skill_dir" != *$'\n'* ]]
            target="$(mktemp -d)"
            (
              cd "$target"
              git init --quiet
              npx --yes skills@1.5.9 add "$GITHUB_WORKSPACE" \
                --skill "$skill" \
                --agent universal \
                --copy \
                --yes
              test -f ".agents/skills/$skill/SKILL.md"
            )
          done < <(jq -r '.skills[].name' "$manifest")

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          manifest="publish/releases/${tag}.json"
          package_root="$(mktemp -d)"
          mkdir -p dist

          while IFS= read -r skill; do
            skill_dir="$(find skills -mindepth 2 -maxdepth 2 -type d -name "$skill" -print)"
            [[ -n "$skill_dir" && "$skill_dir" != *$'\n'* ]]
            skill_package="$package_root/$skill"

            cp -a "$skill_dir" "$skill_package"
            test ! -e "$skill_package/skillhub.json"
            cp LICENSE "$skill_package/LICENSE"
            (
              cd "$package_root"
              zip -X -q -r "$GITHUB_WORKSPACE/dist/${skill}-${tag}.zip" "$skill"
            )
          done < <(jq -r '.skills[].name' "$manifest")

          (
            cd dist
            sha256sum ./*.zip > SHA256SUMS
          )
          {
            printf '## 77hub Skills %s\n\n' "$tag"
            printf '本版本发布以下 Skills：\n'
            jq -r '
              .skills[]
              | "\n### `\(.name)`\n\n**变更级别：** `\(.type)`\n\n\(.changelog)"
            ' "$manifest"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_args=(
            "$tag"
            dist/*.zip
            dist/SHA256SUMS
            --verify-tag
            --title "77hub Skills $tag"
            --notes-file dist/RELEASE_NOTES.md
          )
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
