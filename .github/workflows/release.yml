name: Release skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: $tag" >&2
            exit 1
          fi
          recorded_version="$(<VERSION)"
          if [[ "$recorded_version" != v* ]]; then
            recorded_version="v$recorded_version"
          fi
          if [[ "$tag" != "$recorded_version" ]]; then
            echo "Release tag $tag does not match VERSION $recorded_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate public skills
        run: |
          node scripts/validate-skills.mjs
          node scripts/validate-skillhub-release.mjs --current

      - name: Match release manifest to skill changes
        shell: bash
        run: |
          set -euo pipefail
          manifest="publish/releases/${GITHUB_REF_NAME}.json"
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-version:refname \
              | grep -Fvx "$GITHUB_REF_NAME" \
              | head -n 1 \
              || true
          )"

          known_entries="$(node scripts/validate-skillhub-release.mjs --known-entries)"
          if [[ -z "$known_entries" ]]; then
            echo "No public skills found" >&2
            exit 1
          fi

          while IFS=$'\t' read -r skill skill_dir; do
            listed="$(
              node scripts/validate-skillhub-release.mjs \
                --has \
                "$manifest" \
                "$skill"
            )"

            if [[ -z "$previous_tag" ]]; then
              changed="true"
            elif git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
              "$skill_dir" \
              ":(exclude)$skill_dir/skillhub.json"; then
              changed="false"
            else
              changed="true"
            fi

            if [[ "$listed" != "$changed" ]]; then
              echo "Release manifest mismatch for $skill: listed=$listed changed=$changed" >&2
              exit 1
            fi
          done <<< "$known_entries"

          if [[ -z "$previous_tag" ]]; then
            echo "Validated first release manifest against all skills."
          else
            echo "Validated release manifest against changes since $previous_tag."
          fi

      - name: Verify discovery and individual installation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes skills@1.5.9 add . --list

          manifest="publish/releases/${GITHUB_REF_NAME}.json"
          while IFS=$'\t' read -r skill skill_dir; do
            target="$(mktemp -d)"
            (
              cd "$target"
              git init --quiet
              npx --yes skills@1.5.9 add "$GITHUB_WORKSPACE" \
                --skill "$skill" \
                --agent universal \
                --copy \
                --yes
              test -f ".agents/skills/$skill/SKILL.md"
            )
          done < <(node scripts/validate-skillhub-release.mjs --entries "$manifest")

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          manifest="publish/releases/${tag}.json"
          package_root="$(mktemp -d)"
          mkdir -p dist

          while IFS=$'\t' read -r skill skill_dir; do
            skill_package="$package_root/$skill"

            cp -a "$skill_dir" "$skill_package"
            test ! -e "$skill_package/skillhub.json"
            cp LICENSE "$skill_package/LICENSE"
            (
              cd "$package_root"
              zip -X -q -r "$GITHUB_WORKSPACE/dist/${skill}-${tag}.zip" "$skill"
            )
          done < <(node scripts/validate-skillhub-release.mjs --entries "$manifest")

          (
            cd dist
            sha256sum ./*.zip > SHA256SUMS
          )
          node scripts/validate-skillhub-release.mjs --notes "$manifest" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_args=(
            "$tag"
            dist/*.zip
            dist/SHA256SUMS
            --verify-tag
            --title "77hub Skills $tag"
            --notes-file dist/RELEASE_NOTES.md
          )
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
